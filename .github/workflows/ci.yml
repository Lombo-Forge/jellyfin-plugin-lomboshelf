name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # File hygiene and the leak check, from .pre-commit-config.yaml, then ESLint over the web files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx eslint web tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/leak-check.sh
  plugin-build:
    # Compiles the C# plugin and runs its unit tests. This proves it builds and the pure logic is right, not that it works in Jellyfin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release plugin/Jellyfin.Plugin.LomboShelf/Jellyfin.Plugin.LomboShelf.csproj
      - run: dotnet test -c Release plugin/Jellyfin.Plugin.LomboShelf.Tests/Jellyfin.Plugin.LomboShelf.Tests.csproj
