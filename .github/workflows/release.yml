name: Release
# Push a tag such as v0.1.0 and this publishes a GitHub release with the web files zipped.
# The plugin zip and manifest.json entry come from the C# build, which does not exist yet (docs/design.md).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: cd web && zip -r ../lomboshelf-web.zip .
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: lomboshelf-web.zip
